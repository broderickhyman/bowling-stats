<div class="table-container">
  <div class="mat-headline-medium">Monthly Bowling Statistics</div>

  <table
    mat-table
    [dataSource]="sortedStats()"
    matSort
    (matSortChange)="onSortChange($event)"
    class="monthly-table"
  >
    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
      <td mat-cell *matCellDef="let row">{{ row.date }}</td>
    </ng-container>

    <!-- Average Score Column -->
    <ng-container matColumnDef="averageScore">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Average Score</th>
      <td mat-cell *matCellDef="let row">{{ row.averageScore }}</td>
    </ng-container>

    <!-- Strikes Column -->
    <ng-container matColumnDef="strikesPercent">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Strikes</th>
      <td mat-cell *matCellDef="let row">{{ row.strikesPercent }}%</td>
    </ng-container>

    <!-- Pocket Hits Column -->
    <ng-container matColumnDef="pocketHitsPercent">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Pocket Hits</th>
      <td mat-cell *matCellDef="let row">{{ row.pocketHitsPercent }}%</td>
    </ng-container>

    <!-- Opens Column -->
    <ng-container matColumnDef="opensPercent">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Opens</th>
      <td mat-cell *matCellDef="let row">{{ row.opensPercent }}%</td>
    </ng-container>

    <!-- Spares Column -->
    <ng-container matColumnDef="sparesPercent">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Spares</th>
      <td mat-cell *matCellDef="let row">{{ row.sparesPercent }}%</td>
    </ng-container>

    <!-- Single Pin Pickup Column -->
    <ng-container matColumnDef="singlePinPickupPercent">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Single Pin Pickup</th>
      <td mat-cell *matCellDef="let row">{{ row.singlePinPickupPercent }}%</td>
    </ng-container>

    <!-- Gutters Column -->
    <ng-container matColumnDef="gutters">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Gutters</th>
      <td mat-cell *matCellDef="let row">{{ row.gutters }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
