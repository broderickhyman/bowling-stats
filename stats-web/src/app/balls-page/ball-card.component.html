<mat-card>
  <mat-card-header>
    <mat-card-title>{{ ballStats().name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Average: {{ ballStats().average | number: '1.0-2' }}</p>
    <p>Games: {{ ballStats().games }}</p>
    <p>First Used: {{ ballStats().firstUsed | date: 'shortDate' }}</p>
  </mat-card-content>
</mat-card>
