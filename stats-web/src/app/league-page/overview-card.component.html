<mat-card>
  <mat-card-header>
    <mat-card-title>{{ leagueOverview().name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Average: {{ leagueOverview().average }}</p>
    <p>Games: {{ leagueOverview().count }}</p>
    <p>Start: {{ leagueOverview().start | date: 'shortDate' }}</p>
    <p>End: {{ leagueOverview().end | date: 'shortDate' }}</p>
  </mat-card-content>
  <mat-card-actions>
    <a matButton="outlined" [routerLink]="['/league', leagueOverview().pk]">View</a>
  </mat-card-actions>
</mat-card>
