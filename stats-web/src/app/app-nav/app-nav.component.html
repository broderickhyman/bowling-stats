<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    class="sidenav"
    fixedInViewport
    [attr.role]="'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <!-- <mat-toolbar>Menu</mat-toolbar> -->
    <mat-nav-list>
      <a mat-list-item routerLink="/">Home</a>
      <a mat-list-item routerLink="/leagues">Leagues</a>
      <a mat-list-item routerLink="/balls">Balls</a>
      <a mat-list-item routerLink="/monthly">Monthly Stats</a>
      <a mat-list-item routerLink="/upload">Upload</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content [attr.role]="'main'">
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="sidenav.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>{{ pageTitleService.title() }}</span>
    </mat-toolbar>
    <ng-content select="main"></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
